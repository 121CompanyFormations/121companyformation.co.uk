<!-- Block: BLOG_CARD – example card; platform list items get styled via CSS too -->
<article class="cf-blog-card blog_list_item">
  <a class="cf-blog-card__media blog_img" href="##POST_URL#">
    <img src="##POST_IMAGE#" alt="" loading="lazy" width="640" height="360" />
  </a>
  <div class="cf-blog-card__body blog_content">
    <p class="cf-blog-card__meta post_date">##POST_DATE#</p>
    <h2 class="cf-blog-card__title blog_title"><a href="##POST_URL#">##POST_TITLE#</a></h2>
    <p class="cf-blog-card__excerpt">##POST_EXCERPT#</p>
    <a class="cf-btn cf-btn--soft cf-btn--sm" href="##POST_URL#">Read article</a>
  </div>
</article>
