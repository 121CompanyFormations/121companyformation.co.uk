  <p>After a company has been incorporated, it is possible to change a
   company name to a completely new name at any time. 121 Company
   Formation offers a company name change service to undertake this
   for you.</p>
  <h3>HOW IT WORKS:</h3>
  <ol>
  <li>
   Once you have confirmed the availability of your new company
   name, we will complete the NM01 form and submit it to Companies
   House. We will also pay the Companies House fee on your behalf
   </li>
  <li>
   Within 48 hours or sooner (depending on Companies House response
   times) Companies House will confirm the change of name has been
   processed
   </li>
  <li>
   We will take receipt of the Certificate of Incorporation on
   Change of Name which confirms that your company’s new name
   has been registered, and will forward it to you electronically
   </li>
  <li>
   With a change of company name, the company’s registered
   number will remain the same and therefore the change of name
   will appear in the company’s filing history.
   </li>
  </ol>
  <p>Of note: There is no way to conceal the company’s original
   name in the records held at Companies House. To conceal your
   company’s original name, you will need to close the original
   company and incorporate a new company using your new chosen
   company name.</p><p>If a company changes its actual structure, for example it decides
   to become a public limited company (PLC) rather than a private
   limited company, this does not constitute a company name change.</p>
