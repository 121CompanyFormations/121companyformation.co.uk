  <div class="cf-faq cf-faq--narrow" style="margin-top: 2rem;">
    <h3>Frequently asked questions</h3>
    <details>
      <summary>I’ve already formed a company, can I still use the registered office address service?</summary>
      <div class="cf-faq__body">
        <p>Absolutely! You can change your company’s registered address at any time by completing the appropriate form which is provided by Companies House. Thereafter, update your company documents, website, stationery and any other materials with your new registered office address.</p>
      </div>
    </details>
    <details>
      <summary>As a director, can I use the registered address as my service address?</summary>
      <div class="cf-faq__body">
        <p>Yes, if you would prefer not to disclose your home address on documentation held at Companies House which is accessible to the general public, then you can choose to use our South London service address.</p>
      </div>
    </details>
    <details>
      <summary>Will all mail addressed to my company at the registered office address be forwarded?</summary>
      <div class="cf-faq__body">
        <p>Only statutory correspondence from government agencies and bodies such as Companies House will be forwarded to your chosen address. To have all mail forwarded, select our <a href="/trade-mail-forwarding/">trade mail forwarding</a> service for which a separate fee is payable.</p>
      </div>
    </details>
    <details>
      <summary>What does statutory correspondence include?</summary>
      <div class="cf-faq__body">
        <p>Statutory correspondence includes any item addressed to your company from HMRC (tax, VAT, employer/employee etc.) and Companies House. Official correspondence from Companies House and HMRC will also be forwarded to you.</p>
      </div>
    </details>
    <details>
      <summary>Why is a registered office address service better than using my home address?</summary>
      <div class="cf-faq__body">
        <p>Legally you can use your personal residential address as your company’s business office address. However, there are some major disadvantages. Firstly, your home address will appear on the company information held at Companies House, and this is accessible to the general public. Secondly, any inspection of the company’s records must take place at the company’s registered address. While inspections are unlikely, company members tend to avoid having this conducted in their homes.</p>
      </div>
    </details>
  </div>
