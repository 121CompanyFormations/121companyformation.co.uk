  <h3>
   Refund & Cancellation Policy
   </h3>
  <p>We define below the terms of use currently applicable when using the 121 Company Formation website regarding our refund and cancellation policy. These terms apply to both registered and unregistered users of the website and all clauses contained herein can also be found in both the General and Specific Terms and Conditions of 121 Company Formation.</p>
  <h5>1. Information regarding the 121 Company Formation website</h5>
   

   
   
   www.121companyformation.co.uk is operated by 121 Company Formation, which is the trading name of 121 Company Formation Limited, a company registered in England, company number 07585793. Our registered office is 3rd Floor, 207 Regent Street, London W1B 3HH.
   
   
   

   
   
   <h5>2. Definitions</h5>
   

   
   
   'Our', 'we' and 'us' refers to 121 Company Formation</p><p>'Our site' refers to means our website/s</p><p>'You' and 'your' refers to any business(es) you are associated with or any companies you may be working on behalf, that use our site</p><p>'Services' refer to the company formation service, other associated services that we offer on our website, and all the goods and services that we supply</p><p>'Terms and conditions' refers to the general and specific terms and conditions of the business and Privacy Policy together with any other terms and conditions that may be posted on our website at any time.</p><p>‘Website’, ‘web site’ or ‘site’ refer to the general and specific terms and conditions of the business and our Privacy Policy as well as any other terms and conditions that may be posted on our website at any time.</p><p>'Website', 'Web Site' or 'Site' refers to the 121companyformation.co.uk website.
   
   
   
   

   <h3>
   Refund and Cancellation Policy
   </h3>
  <h5>1. General terms and conditions</h5>
   

   
   
   It is the right of every consumer to be able to cancel a contract for the provision of goods or services within a 14 calendar day period (from the date the contract was made). All cancellations must be made in writing. In the event that we have already begun work on processing your order or have submitted any applications to Companies House on your behalf, your right to cancel no longer applies.
   
   
   

   
   
   <h5>2. Force majeure</h5>
   

   
   
   As soon as we become aware that any incident deemed to be classed as force majeure occurs in conjunction with the terms of this Refund and Cancellation Policy, we will inform you of this as soon as possible. Should the force majeure incident continue for a period exceeding 14 days, then either party holds the right to revoke the contract made between them. In such circumstance you will be granted full reimbursement for all goods, services or products that have been paid for but remain undelivered.
   
   
   

   
   
   <h5>3. Specific terms and conditions</h5>
  <p>a) In the event that a customer’s company formation application is rejected by Companies House, the customer shall not be entitled to a refund, in part or in full, for any services provided by 121 Company Formation in respect of the application.</p>
  <p>b) Once a company formation package has been purchased, a customer may cancel the service and request a refund, providing that i) the notice to cancel is received within 14 days of the date of purchase, and ii) the application has not yet been submitted to Companies House. In this case the customer will be entitled to a refund of any fees paid to us.</p>
  <p>Once we have begun processing the application, an administrative fee may apply.</p><p>After the 14 day period has elapsed, no cancellation/refund requests will be considered.</p>
  <p>c)The customer will not be entitled to a refund i) once a company formation application has been submitted to Companies House or ii) if an application is rejected by Companies House</p>
  <h5>4. Purchases of address services</h5>
  <p>Customers who purchase any of our address services &ndash; registered office address, service address or trade mail forwarding address &ndash; will be bound by the following terms and conditions regarding refunds and cancellations:</p>
  <p>a) A customer is entitled to a refund providing that i) their order has not yet been processed, ii) the address service(s) has not been set up, and iii) the notice to cancel is received within 14 days of the date of purchase. After this 14 day period has elapsed, no cancellation/refund requests will be considered.</p>
  <p>b) A customer shall be entitled to a refund of any fees paid to us less a &pound;30.00 administrative fee per address service if i) the order has already been processed, ii) the address service(s) has been set up, and iii) the notice to cancel is received within 14 days of the date of purchase. After this 14 day period has elapsed, no cancellation/refund requests will be considered.</p>
  <p>c) If a notice to cancel and refund request are received within 14 days of the date of purchase but the customer has used the address service for more than 14 days after the purchase date, no refund will be due.</p>
  <p>d) Address service(s) may be cancelled by either party provided that the notice is provided a full calendar month in advance.</p>
  <h5>5. Purchases of additional services and products</h5>
  <p>The purchase of any our additional services or products are subject to the following Terms and Conditions with regard to refunds and cancellations:</p>
  <p>a) Customers are entitled to a refund if i) their order has not yet been processed and we have yet not begun working to provide the service(s) or product(s), the notice to cancel is received within 14 days of the date of purchase. No cancellation/refund requests will be considered if i) the cancellation request is made after this 14 day period has elapsed, or ii) we have already begun working to provide the service(s) or product(s).</p>
  <p>b) No refund will be granted for any service(s) or product(s) purchased that we are unable to fulfill due to the customer’s failure to provide documentation that is required to process their order (e.g. proof of ID or address), since this information is required for compliance with anti-money laundering regulations and Know Your Customer requirements.</p>
