   financial report which gives an account of its activity over a
   specific accounting period, usually 12 months.</p><p>The company’s accounts are prepared by a firm of accountants
   - based on information supplied by the directors of the company -
   before they are submitted to Companies House.</p><p>121 Company Formation is an experienced accounting firm that
   specializes in offering a range of services to start-ups, small
   and medium-sized companies including offering sound business
   advice, assisting in running their operations in the most
   tax-efficient way, and preparing their year-end accounts.</p>
