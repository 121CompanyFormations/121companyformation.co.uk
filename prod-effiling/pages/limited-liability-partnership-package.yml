  <section class="cf-section">
    <div class="cf-container">
      <div class="cf-prose">
        <p>A limited liability partnership is the formation package most usually used by those offering professional services such as accountants, consultants and solicitors because, whilst they are still able to operate like a traditional partnership, they have the added benefit of the protection that limited liability brings.</p>
        <p>121 Company Formation offers five different types of LLP formation packages which all include the following basic elements:</p>
        <ul>
        <li>A draft LLP agreement (while not a legal requirement, this is a useful document should you wish to divide shares, profits or capital at a later date)</li>
        <li>A full set of company incorporation documents</li>
        <li>Free access to your company management portal</li>
        </ul>
        <p>We offer a very quick service &ndash; your LLP will be usually formed within 3-24 hours of placing your order subject to Companies House activity.</p>
        <p>All you have to do is choose the package that best suits your needs and the time you have available to devote to setting up the LLP.</p>
      </div>
    </div>
  </section>
