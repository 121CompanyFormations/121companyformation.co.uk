  <p>The Bronze Package is perfect for any UK or International companies or individuals who are looking to set up a company quickly and efficiently.</p>
  <p>Our Bronze Package is simple and economical and provides you with all your incorporation documents in PDF format which we will email to you once your company has been formed.</p>
  <h3>What does the Bronze Package include?</h3>
  <p>The Bronze Package is economically priced and offers optimum value including:</p>
  <ul>
  <li>An incorporated limited company that is ready to begin trading</li>
  <li>Officers of the company appointed</li>
  <li>Ordinary shares issued</li>
  <li>A PDF file containing the Certificate of Incorporation, the Memorandum and Articles of Association and the share certificate/s</li>
  <li>Free access to your company management portal</li>
  <li>Free fast-track referral service for <a href="/business-banking/">business banking</a> facilities</li>
  </ul>
  <p>We offer a very quick service &ndash; your company will be usually formed within three to four hours of placing your order, subject to Companies House response times.</p>
  <h3>The process</h3>
  <ol>
  <li>Use our free tool to do a company name search to check that your chosen company name is available. If it is not, we will recommend a few alternatives</li>
  <li>Complete the self-guided company incorporation application form with details of the company secretary, directors, shareholders, <a href="/registered-office-address/">registered address</a> and <a href="/service-address/">director service address</a>, if applicable</li>
  <li>We’ll submit the application to Companies House on your behalf, along with the appropriate fee</li>
  <li>We will contact you via email (typically within 24 business hours), once your company has been incorporated and registered at Companies House.</li>
  </ol>
  <p><a class="cf-btn cf-btn--primary" href="/name-check/lbs-bronze/" onclick="packagesBuyNow('lbs-bronze'); return false;">Buy now</a></p>
