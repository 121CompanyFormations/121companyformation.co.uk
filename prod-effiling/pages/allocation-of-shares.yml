  <p>When a limited company is incorporated, it must issue, or
   allocate, at least one share to one shareholder. However, most
   limited companies have many more shares in issue which are
   allocated by agreement of the relevant parties, i.e. those who
   are, or will be, the majority shareholders</p><p>As well as the shares allocated at the time of incorporation,
   limited companies can also issue new shares. For example, the
   company can sell shares to new investors or existing shareholders
   to raise financing.</p><p>Shareholders should always be aware that, as well as enjoying the
   benefits of any dividends paid to them, each shareholder will have
   a certain obligation should the company fail or be put into
   liquidation.</p><p>The 121 Company Formation Allocation of New Shares service ensures
   the process is completed correctly and that your company’s
   Companies House records are kept up-to-date.</p>
  <h3>HOW IT WORKS</h3>
  <ul>
  <li>
   Order our Allocation of Shares service and will contact you to
   attain the required information
   </li>
  <li>
   We will complete the SH01 form (Return of Allotments form) and
   submit it to Companies House
   </li>
  <li>
   Upon approval, we will send you an electronic copy of your new
   share certificates, memorandum, and articles of association.
   </li>
  </ul>
   The process is typically completed within 24-48 working hours.</p><p><h3>PLEASE NOTE</h3>
  <p>The share transfer is only updated at Companies House once a
   <a
   href="/confirmation-statement-service/"
   >
   Confirmation Statement
   </a>
   is filed. We always advise submitting a confirmation statement
   online in order to fully reflect a share transfer, especially if
   the share transfer is required to open a business bank account or
   for another immediate purpose.</p><p>In the interim, you can use the new share certificates, your
   amended Memorandum & Articles of Association, and your
   original J30 form to prove the share transfer and any private sale
   contracts you may have drawn up.</p>
  <p>Be sure to keep all your company’s records at Companies
   House up to date with our Confirmation Statement service!</p>
  <h3>
   PURCHASE THE TRANSFER OF SHARES SERVICE
   </h3>
  <p>For just &pound;89.99 purchase the Allocation of Shares service
   through our website or for further information email us at:
   
   <a href="mailto:info@121companyformation.co.uk">
   info@121companyformation.co.uk
   </a>
   .</p>
