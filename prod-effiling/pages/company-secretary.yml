  <h2>
   Company Secretary | 121 Company Formation
   </h2>

   
   A company secretary is appointed to take responsibility for a company’s administration. Over the years this function has become less formal to the extent that it is no longer a legal requirement. This role can be held by a company director.</p><p>A company secretary is officially responsible for helping with:
   <ul>
  <li>
   Completing and submitting all statutory documents to Companies House and HMRC
   </li>
  <li>
   Updating and maintaining the company’s records and registers including reporting changes to both HMRC and Companies House
   </li>
  <li>
   Organising board meetings and taking the minutes
   </li>
  <li>
   Authorising documents on behalf of the company’s directors
   </li>
  </ul></p><p>At the time of incorporation or any time after this, 121 Company Formation with require the following details for the company secretary you wish to appoint:
   <ul>
  <li>
   Full name
   </li>
  <li>
  <a href="/service-address/">
   Service address 
   </a>
  </li>
  <li>
   Residential address (not shown on the public record)
   </li>
  <li>
   Country if residence
   </li>
  <li>
   Nationality
   </li>
  <li>
   Date of birth
   </li>
  <li>
   Occupation (Company secretary or director if applicable will suffice)
   </li>
  </ul>
      </div>
