  <script>
  $(function() {
    $(".efOptionalTrProduct").each(function(i, row) {
  var split = row.id.split('_'); //optional_4308
  if(split.length == 1) return;

  var id = split[1];
  var $info = $("#efMoreInfo_"+id);
  if(!$info) return;

  var tds = $("td",row);
  $(tds[0]).append("<span class='details'>"+$info.html()+"</span>");
  $(tds[1]).html("");
    });
  });
  fbq('track', 'AddToCart');
  </script>
