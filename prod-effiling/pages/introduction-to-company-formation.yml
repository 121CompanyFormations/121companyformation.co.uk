  <h2>
   Introduction to Company Formation
   </h2>
  <p>Company formation involves 
   <a href="/packages/#packages">
   incorporating a business 
   </a>
   as a limited company and registering it as a legal entity at Companies House. There are three options when it comes to the constitution of a limited company:</p>
  <ol>
  <li>
   Limited by shares (Ltd) (and Limited by shares for non-UK residents)
   </li>
  <li>
   Limited by guarantee (Ltd) or
   </li>
  <li>
   A limited liability partnership (LLP))
   </li>
  </ol>
  <p>Although referred to as a company, once incorporated the law views the business as an individual entity that holds and owns its own assets, liabilities, property, finance and contractual obligations (i.e. it would be incorrect to say that a company's assets are owned by the shareholders of the company).</p><p>This is one way in which limited companies differ from sole trader enterprises where the business owner owns the assets, liabilities, property, finance and contractual obligations.</p>
  <h3>
   WHAT ARE THE BENEFITS OF INCORPORATING A LIMITED COMPANY?
   </h3>
  <ul>
  <li>
   The process of incorporating a limited company is easy and affordable
   </li>
  <li>
   It limits the financial liability of the shareholders should the company become insolvent or face liquidation at any time (they have limited liability)
   </li>
  <li>
   Because the company itself is a separate legal entity that is owned by the shareholders, guarantors or members (depending on the type incorporation), this means that each shareholder or guarantor is only responsible for the amount of company debt equal to the value of their own shareholding. Ultimately, their personal finances are protected.
   </li>
  <li>
   Limited companies have the gravitas of a professional business operation by having recognised shareholders and directors whose duty it is to run the business responsibly
   </li>
  <li>
   Shareholders, guarantors and partners of limited companies are able to manage their personal remuneration in the most tax efficient way
   </li>
  </ul>
  <h3>
   COMPANIES HOUSE
   </h3>
  <p>Companies House oversees and ensures the compliance of all UK registered companies under company law. This can vary depending on the jurisdiction of the registrar &ndash; companies incorporated in England and Wales fall under the umbrella of the Cardiff registrar, companies incorporated in Scotland fall under the Edinburgh registrar, and those incorporated in Northern Ireland fall under the responsibility of the Belfast registrar.</p><p>Companies House processes all the documentation relating to the incorporation and dissolution of companies and all statutory documentation that relates to limited companies that are currently trading. This information, and information about limited companies that have traded in the past but have now ceased operations are made available to the general public.</p>
  <h3>
   DIFFERENT TYPES OF LIMITED COMPANIES
   </h3>
  <h3>
   Limited by shares
   </h3>
  <p>The majority of new companies that are incorporated in the UK are ‘Limited’ (abbreviated to Ltd). The private limited company structure enables companies that generate profits to pay their shareholders using a tax efficient blend of salary and dividends.</p><p>Another reason this type of company is popular is because it limits the financial liability of the shareholders should the company become insolvent or face liquidation at any time. Because the company is a separate legal entity that is owned by the shareholders, each shareholder is only responsible for the amount of company debt equal to the value of their own shareholding, i.e. their personal finances are protected.</p><p>Other benefits of a private limited by share company include:</p>
  <ul>
  <li>
   They can be incorporated with just one director and one shareholder who can be the same individual
   </li>
  <li>
   For companies incorporated In England and Wales, any number of shares of any nominal value can be issued in any currency
   </li>
  <li>
   Capital can be raised through the issue of new shares
   </li>
  <li>
   A corporate entity can hold the position of either a director or shareholder or both
   </li>
  <li>
   Because shares can be transferred to new or existing shareholders at any time, there is the option for the ownership of a private limited company to be passed on in perpetual succession even if the current owner dies, becomes insolvent or bankrupt
   </li>
  <li>
   The name of a limited company is unique and no other company or entity can register with either the same name or one that Companies House deems too similar
   </li>
  <li>
   Limited companies have the gravitas of a professional business operation by having recognised shareholders and directors whose duty it is to run the business responsibly
   </li>
  </ul>
   A limited by share company must have the following:

   <ul>
  <li>
   Registration at Companies House
   </li>
  <li>
   At least one director who is over the age of 16
   </li>
  <li>
   At least one shareholder (who can also be the sole director)
   </li>
  <li>
  <a href="/registered-office-address/">
   A registered office which is within the country of incorporation 
   </a>
  </li>
  <li>
   Memorandum and articles of association
   </li>
  </ul>
  <h3>
   Limited by Guarantee
   </h3>
  <p>Limited by guarantee is a type of company formation that is used mostly by non-profit or not-for-profit organisations such as sports clubs/associations, organisations that are member-based, or workers’ co-operatives, i.e. companies that do not intend to make a profit.</p><p>This type of company has guarantees and guarantors instead of shares and shareholders. Unlike shareholders who often take dividend (payments) out of the company, guarantors do not take any share of the profits of a limited by guarantee company which allows any such profits to remain in the company to further its objectives. However, Guarantors must guarantee, i.e. are required to pay a certain amount of money towards any debts the company incurs.</p><p>The advantages of a limited by guarantee company is that, because it has members who act as guarantors rather than shareholders/owners, there is limited financial risk for the guarantors’ own personal finances which remain protected should the company face financial difficulties or any legal actions.</p><p>A limited by guarantee company must have the following:</p>
  <ul>
  <li>
   Registration at Companies House
   </li>
  <li>
   At least one member who is over the age of 16
   </li>
  <li>
   At least one guarantor (who can also be the sole director)
   </li>
  <li>
  <a href="/registered-office-address/">
   A registered office which is within the country of incorporation 
   </a>
  </li>
  <li>
   Memorandum and articles of association
   </li>
  </ul>
  <h3>
   Limited Liability Partnership (LLP)
   </h3>
  <p>Many professional businesses, such as solicitors, accountants, consultants and doctors, that have traditionally operated in partnerships tend to form a Limited Liability Partnership (LLP) to reduce their exposure to any personal financial loss.</p><p>Unlike companies limited by shares and companies limited by guarantee, LLPs do not have shareholders or guarantors but members. In this company structure there must be a minimum of two members. There is no maximum number of members that the company can have. Members can reside and work from anywhere in the world.</p><p>The profits from an LLP are shared amongst its members. The company’s members are required to pay income tax and/or National Contribution payments on these drawings.</p><p>A limited liability partnership must have the following:</p>
  <ul>
  <li>
   Registration at Companies House
   </li>
  <li>
   A minimum of two members who are over the age of 16
   </li>
  <li>
  <a href="/registered-office-address/">
   A registered office which is within the country of incorporation 
   </a>
  </li>
  </ul>
   121 Company Formation offers a wide range of online packages to 
   <a href="/packages/#packages">
   incorporate a new company 
   </a>
   in England and Wales, Northern Ireland, Ireland and Scotland as well as a wide variety of business support services such as 
   <a href="/bookkeeping/">
   business bookkeeping and accountancy 
   </a>
   services, and a 
   <a href="/registered-office-address/">
   registered business address 
   </a>
   service with a choice of two addresses to choose from.
   
   

   
   <h3>
   COULD MY APPLICATION TO INCORPORATE MY COMPANY BE REJECTED?
   </h3>
  <p>Yes, this can and does happen for a variety of reasons. 121 Company Formation thoroughly reviews every application before we submit it which allows us to identify and address any errors or omissions prior to submission. In the unlikely event that your application is returned due to an error or omission we can address and resolve it quickly</p>
