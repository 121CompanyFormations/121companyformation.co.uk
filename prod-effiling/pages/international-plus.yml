      <div class="cf-split">
        <div class="cf-prose">
          <p>The International Plus Package offered by 121 Company Formation has been designed to offer a full range of services to clients who are based anywhere in the world. It includes the incorporation of a new company as well as the preparation and submission of the first year&rsquo;s Confirmation Statement, and the use of our prestigious London address as their Registered Office and Director Service Address, as well as first Year End Accounts and Tax Return.</p>
          <h3>What does the international package include?</h3>
          <p>The International Plus Package offers all the benefits of the International Package with the added bonus of access to our full accountancy service in the first year of trading of the company&rsquo;s first financial year, we will prepare and submit the first year&rsquo;s accounts (subject to a maximum turnover of &pound;100K, less than 1500 transactions) and Corporation Tax Return.</p>
          <p>121 Company Formation offers a comprehensive accountancy service. As an experienced accounting company that specialises in offering sound business advice to start-up, small and medium sized companies, we can assist you to run operations in the most tax efficient way and offer whatever advice you may need during your first year of trading. Optional quarterly VAT returns are also included in the International Plus Package.</p>
          <ul>
          <li>An incorporated limited company that is ready to begin trading</li>
          <li>Officers of the company appointed</li>
          <li>Ordinary shares issued&nbsp;</li>
          <li>A PDF file containing the Certificate of Incorporation, the Memorandum and Articles of Association and the share certificate/s</li>
          <li>Printed copies of the above documents</li>
          <li>Filing of the company&rsquo;s Confirmation Statement for the first year</li>
          <li>Optional VAT Registration</li>
          <li>Registered Office address service for one year using our prestigious London address for receipt of all statutory documents and official correspondence from HMRC and Companies House&nbsp;</li>
          <li>Director service address service for one year using our prestigious London address for receipt of all statutory documents and official correspondence from HMRC and Companies House addressed to the directors of the company</li>
          <li>Free access to your company management portal</li>
          <li>First Year End Accounts and Corporation Tax Return</li>
          </ul>
          <p>We offer a very quick service &ndash; your company will be usually formed within 3-24 hours of placing your order subject to Companies House activity.</p>
          <h3>What we do to incorporate your company</h3>
          <ul>
          <li>We check that your chosen company name is available for use and suggest alternatives if this is not the case</li>
          <li>Complete the company incorporation application form with details of the company secretary, directors, shareholders, Registered Address and Director Service Address, if applicable. Please see below for a detailed explanation of these.</li>
          <li>Submit the application to Companies House together with the appropriate fee</li>
          <li>You will then receive a confirmation by email, usually within 24 hours, that your company has been incorporated and registered at Companies House</li>
          </ul>
          <h3>FREQUENTLY ASKED QUESTIONS</h3>
          <div class="cf-faq cf-faq--page">
          <details>
          <summary>If I live outside the UK, can I set up a UK registered limited company?</summary>
          <div class="cf-faq__body">
          <p>Yes, anyone can form a UK registered limited company. Providing the registered address is within the UK, neither the directors nor shareholders are required to be UK residents. This is another advantage of using our International Packages because they include the use of our registered address service.</p>
          </div>
          </details>
          <details>
          <summary>Does every company have to file a confirmation statement every year?</summary>
          <div class="cf-faq__body">
          <p>Yes, even if there have been no changes throughout the year or if the company is dormant, a confirmation statement must still be filed every year.</p>
          </div>
          </details>
          </div>
