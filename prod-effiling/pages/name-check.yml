      <section class="cf-section cf-section--muted" aria-labelledby="cf-nc-faq-title">
        <div class="cf-container">
          <div class="cf-sec-head">
            <p class="cf-eyebrow">Name check FAQ</p>
            <h2 id="cf-nc-faq-title" class="cf-h2">Before you continue</h2>
          </div>
          <div class="cf-faq cf-faq--narrow">
            <details>
              <summary>Is the company name check free?</summary>
              <div class="cf-faq__body">
                <p>Yes. You can search as many variations as you like, with no account or payment required.</p>
              </div>
            </details>
            <details>
              <summary>If it says available, is the name guaranteed?</summary>
              <div class="cf-faq__body">
                <p>No name can be reserved in the UK. Companies House makes the final decision when your application is reviewed. We check again before filing and will contact you if there is a problem.</p>
              </div>
            </details>
            <details>
              <summary>Do I need to add Limited or Ltd?</summary>
              <div class="cf-faq__body">
                <p>Private limited companies must end in Limited or Ltd. You can type the trading name — we ensure the correct ending is used when we submit to Companies House.</p>
              </div>
            </details>
            <details>
              <summary>What happens after I click Continue?</summary>
              <div class="cf-faq__body">
                <p>Choose a formation package, then complete your online order with director, shareholder and address details. We file electronically and most companies are incorporated within about 24 hours*.</p>
              </div>
            </details>
          </div>
          <p class="cf-nc-faq-note">*Subject to Companies House workload on working days.</p>
        </div>
