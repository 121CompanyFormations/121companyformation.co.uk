  <p>This service enables you to use our prestigious Central London address as the contact address for your company. This means that all business and general mail* will be delivered to our address which will then be forwarded to you on the same day. Your forwarding address can be anywhere in the world.</p><p>The 121 Company Formation trade mail forwarding service can be used in conjunction with our 
   <a href="/registered-office-address/">
   registered address service 
   </a>
   and our 
   <a href="/service-address/">
   service address 
   </a>
   .</p>
  <h3>
   WHY USE THE TRADE MAIL FORWARDING SERVICE:
   </h3>
  <ul>
  <li>
   Enhance the professional image of your company with a prestigious Central London address
   </li>
  <li>
   Keeps your private address off official records and maintains the privacy of your personal address
   </li>
  <li>
   Maintain separation between private and company affairs
   </li>
  <li>
   Have all your correspondence forwarded to an address of your choice
   </li>
  <li>
   Avoid receiving junk and other unsolicited mail to your private address
   </li>
  </ul>
  <h3>
   WHAT IS INCLUDED IN THE TRADE MAIL FORWARDING SERVICE?
   </h3>
  <ul>
  <li>
   We will ensure that all mail addressed to your company is forwarded to you on the same day we receive it.
   </li>
  <li>
   There is an annual fee payable for the trade mail forwarding service of &pound;195.00. We will automatically invite you to renew your subscription at the appropriate time. You may cancel the annual renewal at any time via our Admin portal.
   </li>
  <li>
   If you wish to use the trade mail forwarding service for more than one company, then the fee of &pound;195.00 applies for each company.
   </li>
  </ul>
  <h3>
   HOW IT WORKS
   </h3>
  <ol>
  <li>
   Purchase the service and attach the required documentation (A copy of your passport and a copy of either a bank statement or utility bill that shows your name and address and is dated within the last 3 months). We will send you an email confirming your order, your invoice, along with the documentation you will need to complete the process
   </li>
  <li>
   Once all your contacts have been notified and we start receiving your mail on your behalf, we will immediately begin forwarding all your mail to an address of your choice, anywhere in the world.
   </li>
  <li>
   Renew the service on an annual basis to continue to have your mail forwarded to you, at your chosen address, anywhere in the world.
   </li>
  </ol>
  <h3>
   PURCHASE TRADE MAIL FORWARDING SERVICE
   </h3>
  <p>For just &pound;195.00 purchase the Trade Mail Forwarding service through our website or for further information email us at 
   <a href="mailto:info@121companyformation.co.uk">
   info@121companyformation.co.uk 
   </a></p>
