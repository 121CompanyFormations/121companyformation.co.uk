        <div class="cf-prose">
          <p>The Bronze Package is the best option for those who are looking to set a company up for a relatively low cost.</p>
          <p>Despite being a simple and economical package, nevertheless you will receive a full set of incorporation documents in PDF format which we will email to you once your company has been formed.</p>
          <h3>What does the Bronze Package include?</h3>
          <p>While it may be the least expensive package in our range, this package offers optimum value and includes</p>
          <ul>
          <li>An incorporated limited company that is ready to begin trading</li>
          <li>Officers of the company appointed</li>
          <li>Ordinary shares issued&nbsp;</li>
          <li>A PDF file containing the Certificate of Incorporation, the Memorandum and Articles of Association and the share certificate/s</li>
          <li>Free access to your company management portal</li>
          <li>Free fast-track referral service for business banking facilities</li>
          </ul>
          <p>We offer a very quick service &ndash; your company will be usually formed within three to four hours of placing your order subject to Companies House activity</p>
          <p>121 Company Formation will be happy to advise if the Bronze Limited by Guarantee package is right for you providing you can confirm that the proposed company is not:</p>
          <ul>
          <li>A charity</li>
          <li>Seeking exemption from using the word &lsquo;Limited&rsquo; in its name</li>
          <li>Intending to use the words Foundation, Society, Association, Trust, Federation or benevolent in its name</li>
          <li>Intending to operate as a Right to Manage company</li>
          </ul>
          <h3>What we do to incorporate your company</h3>
          <ul>
          <li>We check that your chosen company name is available for use and suggest alternatives if this is not the case</li>
          <li>Complete the company incorporation application form with details of the company secretary, directors and registered address.</li>
          <li>Details of the members must also be included and this must include a minimum of one member and one guarantor either of whom can also be a director</li>
          <li>Submit the application to Companies House together with the appropriate fee</li>
          <li>You will then receive a confirmation by email, usually within 24 hours, that your company has been incorporated and registered at Companies House</li>
          </ul>
          <h3>FREQUENTLY ASKED QUESTIONS</h3>
          <div class="cf-faq cf-faq--page">
          <details>
          <summary>What does limited by guarantee mean?</summary>
          <div class="cf-faq__body">
          <p>This type of company has guarantees and guarantors instead of shares and shareholders and it is generally a non-profit or not-for-profit organisation.</p>
          </div>
          </details>
          <details>
          <summary>When would you choose to be a limited by guarantee company instead of a private limited company?</summary>
          <div class="cf-faq__body">
          <p>Examples of when to use this type of company formation would be when you want to set up a sports club or association, an organisation that entails membership or a workers&rsquo; co-operative, i.e. one that does not intend to make a profit.</p>
          </div>
          </details>
          <details>
          <summary>What are the advantages of this?</summary>
          <div class="cf-faq__body">
          <p>Because a limited by guarantee company is owned by its guarantors rather than shareholders, this means there is limited financial liability for the guarantors&rsquo; own personal finances which remain protected should the company face financial difficulties or any legal process.</p>
          </div>
          </details>
          <details>
          <summary>Why is a guarantor different to a shareholder?</summary>
          <div class="cf-faq__body">
          <p>Unlike shareholders who often take a dividend out of a company, guarantors do not take any share of the profits of a limited by guarantee company allowing any such profits to remain in the company to further its objectives.</p>
          </div>
          </details>
          <details>
          <summary>Can a charity use this type of company incorporation?</summary>
          <div class="cf-faq__body">
          <p>No, because to incorporate a charitable company, the standard Memorandum and Article of Association cannot be used. A charity would require a special set of these that clearly state the specific objectives of the company.</p>
          </div>
          </details>
