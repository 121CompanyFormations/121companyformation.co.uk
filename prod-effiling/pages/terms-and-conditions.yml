  <h3>
   TERMS AND CONDITIONS
   </h3>
  <p>There are several ways that directors can be paid by a limited company, for example by salaries and, if they are also a shareholder, through dividends. It is therefore important to ensure that how a director is paid is in the most tax effective way.</p>
  <h5>1. Information regarding the 121 Company Formation website</h5>
   

   
   
   www.121companyformation.co.uk is operated by 121 Company Formation, which is the trading name of 121 Company Formation Limited, a company registered in England, company number 07585793. Our registered office is 3rd Floor, 207 Regent Street, London W1B 3HH.
   
   
   

   
   
   <h5>2. Definitions</h5>
   

   
   
   Our', 'we' and 'us' refers to 121 Company Formation</p><p>'Our site' refers to means our website/s</p><p>'You' and 'your' refers to any business(es) you are associated with or any company/ies you may be working on behalf, that use our site</p><p>'Services'refer to the company formation service, other associated services that we offer on our website, and all the goods and services that we supply</p><p>'Terms and conditions'refer to the general and specific terms and conditions of the business and our Privacy Policy as well as any other terms and conditions that may be posted on our website at any time</p><p>‘Website’, ‘web site’ or ‘site’refers to the 121companyformation.co.uk website
   
   
   

   
   
   <h5>3. The 121 Company Formation website</h5>
  <p>a)Users of this website are deemed to have read, understood and accept our Terms and Conditions. If a user does not agree with the Terms and Conditions or clause therein and does not undertake to be bound by those terms, they must immediately stop using the website</p>
  <p>b) By using this website users acknowledge that they have the legal capacity to accept the website’s Terms and Conditions, as well as any specific Terms and Conditions that are added which apply to the purchasing of any services or products.</p>
  <p>c)When a user visits our website for the first time to request information or to purchase a service or product, they will be required to select a username and a password which will allow them to subsequently access their online account at any time in the future. Users are responsible for maintaining the confidentiality of their username and password and should not share this with anyone. 121 Company Formation will not be held responsible for any changes to a user’s account that result from the unauthorised use of a username or password. In accepting these Terms and Conditions, the user agrees to indemnify and hold harmless 121 Company Formation in relation to any loss or damage that may rise from a breach of this clause.</p>
  <p>d) Every time a user accesses this website and/or uses our services, it is agreed that a contract is formed on the basis of these Terms and Conditions which will apply to each contract that a user makes with us. No other terms and conditions will apply.</p>
  <h5>4. Third-party websites and services</h5>
   

   
   
   Our website may contain hyperlinks, applications and plug-ins that relate to third-party links. Neither these nor their privacy policies are controlled by 121 Company Formation. By choosing to click on any such links you may be permitting third parties to share or collect your personal data. We would advise the user of any website to view the privacy policy of that site to verify its the Terms and Conditions and confirm that they are acceptable to you as the user. Visitors to our website should be aware that, however brief the visit, information may be collected. Our use of your personal data is governed by the Data Protection Act 1998 and, in accordance with the act, upon your request we are obliged to provide you the details of any data we hold about you. A nominal charge may apply for the processing of any such request.</p><p>121 Company Formation does not store nor share any personal or financial information with third parties. To do so would be against our company policy.
   
   
   

   
   
   <h5>5. Cookies</h5>
   

   
   
   Cookies, which are small date files that are stored on a user’s computer, enable 121 Company Formation to tailor a user’s experience when visiting our website. Upon visiting the website, a user is deemed to have consented to our use of cookies. Cookies may be turned off by a user by adjusting the settings. Cookies may store details of usernames and passwords.
   
   
   

   
   
   <h5>6. Force Majeure</h5>
   

   
   
   121 Company Formation will not be held responsible for a breach of these Terms and Conditions. We also not be held responsible for a failure to provide (or a delay in providing) the services and products offered through this website due to an event or circumstances that are beyond our reasonable control including, but not limited to, fire, accident or explosion or a breakdown in access to networks or systems (force majeure). In these circumstances, we will be entitled to a reasonable extension to the time in which we fulfil our obligations to the user should an event occur that is deemed force majeure.</p><p>As soon as we become aware that any incident has occurred that is deemed force majeure, as per our Terms and Conditions, we will inform you as soon as possible. Should the force majeure incident continue for a period exceeding 14 days, then either party holds the right to revoke any contracts made between them. In such circumstances, you will be fully reimbursed for all goods, services or products that have been paid for but are not delivered.
   
   
   

   
   
   <h5>7. Intellectual Property (Copyright and Trademarks)</h5>
   

   
   
   All material and content on this website, including but not limited to its design, graphic and texts, are copyright by 121 Company Formation or other third parties as applicable. Company names and registered and unregistered trademarks remain the property of their owners. Users are permitted to electronically download, copy and/or print only the content of this website that relates to their purchase of services and products through this website. Any other use of such content with our prior written permission is strictly prohibited and in breach of the relevant laws pertaining to copyright and IP.</p><p>Users are permitted to view and temporarily store in the temporary cache of their browser, content from this website’s pages. Users may also print a single copy of this content for their own use, to reference and/or review offline.</p><p>A user may not sell any content relating to any service or product purchased from this website unless:</p><p>a) Permission is expressly given or</p><p>b) Where doing so contributes to the delivery of the purchase of a service or product.
   
   
   

   
   
   <h5>8. Exclusions and Limitations</h5>
   

   
   
   No warranties or representations whatsoever are made regarding the appropriateness, completeness or accuracy of any content or information published on this website. Whilst certain precautions have been taken to decrease the risk of viruses or similar malicious codes being transmitted via this website, we offer no assurance that these are sufficient to prevent any damage as a result.</p><p>The information and content contained within this website may contain typographical errors or technical inconsistencies and as such represents a general outline of our services. As a user, your statutory rights regarding implied terms as to the quality, alignment to description or sample and fitness for purpose of a service or product are not affected.</p><p>Liability for any damages or loss will be limited to the value of supplying the service or product to the user again on a replacement basis. There may be exceptions if claims relate to personal injury or death which result from negligence, fraud or as otherwise regulated by law</p><p>In accepting these Terms and conditions, users agree that the limited liability outlined in the Terms and Conditions is reasonable as it pertains to this website and the nature of the business it represents. Every purchase of a service or product is deemed a new contract.</p><p>Each of the above provisions shall be deemed to be separate and severable provisions with these Terms and Conditions.
   
   
   

   
   
   <h5>9. Governing law and Jurisdiction</h5>
   

   
   
   All contracts and relationships between users of this website and 121 Company Formation will be subject to British law over which English courts have exclusive jurisdiction. This would apply to any dispute that arises from the use of this website and/or any services or products purchased through it.</p><p>If any aspect or clause of these Terms and Conditions is deemed to be invalid, unlawful or non-enforceable, then that particular provision will be deemed to have been severed from the remaining Terms and Conditions which will remain valid and enforceable.</p><p>Only the user who is a direct party to any contract or agreement that is covered by these Terms and Conditions has the right to enforce any such term or condition under the Contracts (Rights of Third Parties) Act 1999.</p><p>A user has the right to cancel a contract relating to the provision of services and products providing the request to do so is made in writing before 7 days have elapsed since the date of purchase or the day on which the contract was entered into. The right to cancel a contract no longer applies once work has begun.
   
   
   

   
   
   <h5>10. Notices</h5>
   

   
   
   Where a notice is required for TBA as outlined in the general or specific Terms and Conditions of this website, the notice must be delivered either personally, by first class mail, via a prepaid airmail service, sent by fax, or submitted by electronic email. Whichever delivery method is used, notice will have been deemed to have been given once it has been received by 121 Company Formation.
   
   
   

   
   
   <h5>11. Complaints</h5>
   

   
   
   It is inevitable that on occasion, service delivery may not be as promised which may occur for a variety of reasons. In these instances, we will make every effort to ensure that our fully trained staff makes every effort to resolve any complaints to the full satisfaction of our clients. Users can request help, further support, or make a complaint by emailing support@121companyformation.co.uk.
   
   
   

   
   
   <h5>12. Waiver</h5>
   

   
   
   In the event where an implicit or explicit waiver applies, it will apply solely to that contract, service and/or product, and will not affect the right to enforce those rights on a subsequent contract, service, or product.
   
   
   

   
   
   <h5>13. Miscellaneous</h5>
   

   
   
   If any clause contained within these Terms and Conditions is deemed to be invalid, unlawful or non-enforceable, that clause will be deemed to have been severed from the remaining Terms and Conditions which will remain valid and enforceable.</p><p>Should there be a discrepancy between these Terms and Conditions and any Specific Terms and Conditions in relation to the purchase of services and products then the Specific Terms and Conditions will apply.
   
   
   
   

   <h3>
  <strong>Specific Terms and Conditions 121companyformation.co.uk </strong>
  </h3>
  <p>All transactions that are done on the 121 Company Formation are subject to the specific Terms and Conditions as per below which should be read in conjunction with the General Terms and conditions as outlined above.</p>
  <h5>1. Information regarding the 121 Company Formation website</h5>
   

   
   
   www.121companyformation.co.uk is operated by 121 Company Formation, which is the trading name of 121 Company Formation Limited, a company registered in England, company number 07585793. Our registered office is 3rd Floor, 207 Regent Street, London W1B 3HH.
   
   
   

   
   
   <h5>2. Limitation of liability</h5>
  <p>By purchasing the 121 Company Formation company registration service, users grant us the right to act as an authorised person to file the application at Companies House on their behalf</p>
  <h5>Special Limitation of Liability</h5>
  <p>a) 121 Company Formation accepts no liability for any errors or omissions that a user submits on their company formation application via the website or if the application is rejected by Companies House as a result.</p>
  <p>b) Should a company formation application be rejected by Companies House, the user will not be entitled to a refund for the services provided by 121 Company Formation.</p>
  <p>c)121 Company Formation accepts no liability when:</p>
  <ul>
  <li>
   A company is either struck off or removed from the Companies House Register for reasons beyond our contro
   </li>
  <li>
   The user cancels our services or
   </li>
  <li>
   A company allows its business support service(s) to lapse and as a result, fails to meet its statutory requirements.
   </li>
  </ul>
  <p>d) It is the responsibility of the user to ensure that the company name that is selected is available and that there are no legal restrictions on its use. 121 Company Formation accepts no liability for the company name that a user selects and/or any problems that may arise therefrom.</p>
  <h5>3. Requirements to be able to use our incorporation services</h5>
  <p>a) It is a requirement of UK law that in order to register a limited company or limited company partnership and to serve as a director, company secretary or member, you must be over the age of 16.</p>
  <p>b)Those who have been declared bankrupt or are in the process of facing bankruptcy proceedings are prohibited from registering a limited company or acting as a director or company secretary. Undischarged bankrupts are only permitted to hold shares in a company limited by shares</p>
  <p>c)Anybody named on the Disqualified Directors Register at Companies House is not permitted to a) register a new limited company or LLP; b) act as a company director or company secretary. They are permitted to hold shares in a company limited by shares.</p>
  <p>d) 121 Company Formation accepts no responsibility or liability for any issues that may result from a limited company (or its employees) failing to meet its statutory or legal requirements as it pertains to company formation.</p>
  <h5>4. Incorporation process</h5>
   

   
   
   As an online company formation service, 121 Company Formation uses the electronic filing facility provided by Companies House.</p><p>The process of incorporation is typically completed within 3 to 24 business hours. This timeframe may vary as it is subject to Companies House workloads, which is entirely out control.</p><p>We are unable to guarantee that company formation applications to register a limited company or LLP will be accepted and approved on the same working day.</p><p>If an expedited service is required, users can purchase our Guaranteed Same Day Service which is offered as one of our additional services.</p><p>In the event that a user submits an application that contains errors, we will be unable to submit the application to Companies’ House until the errors have been rectified. In this case, we will make every effort to contact the user to rectify the errors. If we are unable to contact the user within 14 days of their purchase, we reserve the right to cancel the application.
   
   
   

   
   
   <h5>5. Prices and Payment</h5>
   

   
   
   The price for each service and product is detailed on this website. We reserve the right to alter any price at any time providing that update is reflected on our website.</p><p>The prices shown on our website include any fees that are charged by Companies House. Companies House may adjust and revise their prices at any time, which will be reflected in our prices, as shown on the website</p><p>Payments may be made by credit card, debit card, PayPal or bank transfer. Any other form of payment will require prior agreement from 121 Company Formation.</p><p>Clicking the ‘Buy now’, ‘Order’ and ‘Proceed’ buttons (or any other buttons related to purchasing a service or product) on this website indicates the user’s agreement to pay the prices detailed on this website.</p><p>All limited companies and limited liability partnerships remain the property of 121 Company Formation until full payment has been received.
   
   
   

   
   
   <h5>6. Proof of Identity</h5>
   

   
   
   By accepting these Terms and Conditions you are authorising 121 Company Formation to carry out online ID verification checks via a 3rd party organisation to confirm your identity and residential address. This online check may be recorded and retained on your personal credit file.</p><p>If we are unable to successfully verify your identity and residential address via our initial verification process, we will require you to provide certified copies of your proof of identity and residential address in order to satisfy UK Anti-Money Laundering regulations. Failure to comply with a request for additional documentation will result in the cancellation of our service. Request for additional documentation may incur an additional administration fee.</p><p>As a company formation provider, we are legally obliged to do our due diligence checks on our clients, company officers and members (Directors, Company Secretaries, Persons with Significant Control, Shareholders) when appropriate to do so, and where services are provided on an ongoing basis. Should any of our checks result in the discovery of illegal or unethical activities, we reserve the right to terminate services without notice and without refund. Furthermore, we may report these findings to the relevant authorities by way of a Suspicious Activity Report.</p><p>We also have an obligation to satisfy 'Know Your Customer' (KYC) obligations. To this end, you will be asked to complete a short questionnaire on the business activities of your company and the reason for your business relationship with 121 Company Formation.
   
   
   

   
   
   <h5>7. Conditions for use of the 121 Company Formation address services</h5>
  <p>a) Purchasing our trade mail forwarding address service will enable you to use our address as the address to which all non-statutory business and general mail will be delivered. This service does not include the use of our address as your company’s trading address or principal place of business when registering for any HMRC matters (for this service please see our Registered Office service). As such, no official correspondence or statutory documentation will be accepted or forwarded by 121 Company Formation if this service has not been purchased.</p>
  <p>b)If a user purchases either the registered office address service or the service address(es) service from 121 Company Formation without registering for an account, then it is their responsibility to notify Companies House of the changes to their address(es) so that the details held on the public register are updated.</p>
  <p>c)Renewal payments for all 121 Company Formation address services must be paid promptly, i.e. either before or on the renewal date. In the case of the registered office address service and the service address service, failure to pay the renewal fees on time or to satisfy the ID requirements, will lead to the address reverting to the residential address originally supplied on the company formation application (or any address that was subsequently provided to us). In the event that a non-UK resident fails to renew their address service(s), 121 Company Formation will apply to Companies House to remove our address from their records to ensure that we no longer appear on the register as the company’s registered office address or service address.</p>
  <p>d) We retain the right to revoke the use of our address in connection with your company if you been deemed to have tarnished our reputation, caused or are a substantial threat to our company. In these circumstances, 121 Company Formation will apply to Companies House to remove our address from their records to ensure that we no longer appear on the register as the company’s registered office address or service address. The company’s address will revert to the user’s residential address (or any address that was subsequently provided to us).</p>
  <p>e) A user can purchase multiple 121 Company Formation address services. Where our address services are required for more than one company, the appropriate fee will apply for each company.</p>
  <p>f) In the event that mail we send from our office to a customer’s forwarding address is returned, we will take certain steps to ensure the customer receives this mail. We will, in the first instance, contact the customer to verify the forwarding address details. We will offer to open the mail, scan and email it to the customer. Should the customer prefer for the mail to be re-sent by mail, a fee equivalent to the postal rate payable plus a 15% handling charge will apply. In the event where the non-delivery to the forwarding address was as a result of an error on our part, then the mail will be posted to the verified forwarding address at no charge.</p>
  <p>g)Any mail addressed to customers using our trade mail forwarding service which i) is larger than A4, ii) contains an item of value, iii) a bank card or a cheque, or iv) similar items that cannot be scanned, will be forwarded to the customer by mail. A fee equivalent to the postal rate payable plus a 15% handling charge will apply.</p>
  <p>h) If a customer requests that mail is forward by a courier, payment for this additional service must be made in advance. We will raise an invoice for a fee equivalent to the courier’s charge.</p>
  <p>i) Similarly, if a customer requires mail to be forwarded using any of the Royal Mail services, i.e. Special Delivery, Guaranteed, International Tracked, we will raise an invoice for a fee equivalent to the postage charge plus a 15% handling charge. Payment will automatically be taken from the payment card registered on our system. By accepting these Terms and Conditions, the customer grants permission for 121 Company Formation to raise payment for the invoice using this payment card.</p>
  <p>j) If we are unable to forward a customer’s mail for any reason or if we are unable to secure payment for additional courier/postal charges the customer will be contacted and consulted for further instructions. If no response or instructions are received within 30 days from the date of first attempted contact, 121 Company Formation reserves the right to either dispose of the item or return it to the original sender.</p>
  <p>k) Note that parcels, stock and promotional deliveries are not permitted, and if accommodated will incur additional fees to be determined on a case by case basis.</p>
  <h5>8. Conditions for use of the 121 Company Formation business telephone service</h5>
   

   
   
   The telephone numbers used for the business telephone service and the call answering service are not owned by 121 Company Formation. Should a customer wish to extend the use of the business telephone number service after it expires, the customer will need to contact the relevant telecoms provider directly to arrange for the telephone number to be transferred.
   
   
   

   
   
   <h5>9. Conditions for use for 121 Company Formation bank account referral service</h5>
  <p>a) We are pleased to offer our company formation clients a complimentary fast-track referral service for various financial institutions. The application and approval for a business bank account and/or other banking services cannot be guaranteed as they are subject to the eligibility checks that are conducted by the financial institutions. This is a free referral service so no fee is charged and therefore no fee is refundable.</p>
  <p>b) The bank account referral service is not available to customers who are not resident in the UK.</p>
  <p>c) Customers who use our bank account referral service are automatically agreeing to their details being shared with the financial institution(s), and to being contacted by the financial institution(s) in order for the bank account application to be processed.</p>
  <p>d)In the event where a user is purchasing our services for a third party, and also wishes to use our bank account referral service for that third party, acceptance of our Terms and Conditions means that the third party is agreeing to i) the user submitting their details for the purpose of opening a bank account and ii) being contacted by the bank to process their bank account application.</p>
  <p>e)Any business bank account offered by and/or opened with a financial institution is subject to the bank’s Terms and Conditions.</p>
  <h5>10. Refund policy</h5>
  <p>a) <b>Company formation service</b></p>
  <p>Once a company formation package has been purchased, a customer may cancel the service and request a refund, providing that i) the notice to cancel is received within 14 days of the date of purchase, and ii) the application has not yet been submitted to Companies House. In this case the customer will be entitled to a refund of any fees paid to us.</p><p>Once we have begun processing the application, an administrative fee may apply.</p><p>After the 14 day period has elapsed, no cancellation/refund requests will be considered.</p><p>The customer will not be entitled to a refund i) once a company formation application has been submitted to Companies House or ii) if an application is rejected by Companies House</p>
  <p>b) <b>Address services</b></p>
  <p>Customers are entitled to a refund of any fees for for our address services providing that i) notice to cancel and the refund request are received within 14 days of the date of purchase, ii) the order has not yet been processed, and iii) the address service(s) has not yet be set up. Once the 14 day period has elapsed, no cancellation/refund requests will be considered.</p><p>In the event that an order has already been processed and the address service(s) has been set up, a refund of any fees paid to us less a &pound;30.00 administrative fee per address service will be granted providing the notice to cancel is received within 14 days of the date of purchase. Once the 14 day period has elapsed, no cancellation/refund requests will be considered.</p><p>If a notice to cancel and refund request are received within 14 days of the date of purchase but the customer has used the address service for more than 14 days after the purchase date, no refund will be due.</p><p>Address service(s) may be cancelled by either party provided that the notice is provided a full calendar month in advance.</p>
  <p>c) <b>Additional services and products</b></p>
  <p>The purchase of any our additional services or products are subject to the following Terms and Conditions with regard to refunds and cancellations:</p><p>Customers are entitled to a refund if i) their order has not yet been processed and we have yet not begun working to provide the service(s) or product(s), the notice to cancel is received within 14 days of the date of purchase. No cancellation/refund requests will be considered if i) the cancellation request is made after this 14 day period has elapsed, or ii) we have already begun working to provide the service(s) or product(s).</p><p>No refund will be granted for any service(s) or product(s) purchased that we are unable to fulfill due to the customer’s failure to provide documentation that is required to process their order (e.g. proof of ID or address), since this information is required for compliance with anti-money laundering regulations and Know Your Customer requirements.</p>
