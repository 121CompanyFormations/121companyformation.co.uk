          <h3>We offer a combined company formation and bank account service</h3>
          <p>As a leading UK Company Formation Agent, 121 Company Formation has been appointed as a Barclays Approved new business partner. Through our unique agreement with Barclays Bank PLC, <strong>121 Company Formation</strong> offers a fast track account opening process, subject to Barclays&#39; due diligence checks.</p>
          <h3>Main features:</h3>
          <ul>
          <li>Your application will be channelled through the Barclays automated fast track process</li>
          <li>1 year free banking for Start-up businesses</li>
          <li>Dedicated Local Business Manager</li>
          <li>24/7 award winning banking support</li>
          <li>Online, Telephone &amp; branch based banking</li>
          <li>Access to a network of local experts &amp; specialists</li>
          <li>Free seminars, workshops and business skills training</li>
          <li>A unique award winning credit management service to help prevent and reduce the risk of late payment and bad debt</li>
          <li>2GB free of data backup storage to protect business critical data</li>
          <li>Subsidised Payroll services</li>
          <li>Savings of up to &pound;2,000 on the market leading essential business software applications and services including Sage &amp; QuickBooks and business compliance services</li>
          </ul>
          <h3>How does it work?</h3>
          <p>You must have successfully registered a limited company to use this service.</p>
          <p>Less than 24 hours after your company has been accepted and registered by Companies House, your contact details will be referred to a Barclays Local Business Manager at a branch close to your business premises.</p>
          <p>The Local Business Manager will then contact you no later than 48 hours after receiving your details to welcome you to Barclays, discuss your needs and arrange a suitable time to meet up and open their new business account, subject to Barclays&#39; due diligence checks.</p>
          <p>This process has been designed to ensure that our customers receive a first class priority service.</p>
          <h3>Resigster A Company Now for your Free Barclays Business Banking*</h3>
          <p><small>*Subject to Barclays Bank approval.</small></p>
          <p><small>##GA1#</small></p>
