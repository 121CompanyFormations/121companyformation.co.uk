      <div class="cf-prose">
  <p>The Diamond Package is the premium service for those who would like
   every aspect of setting up a company and the first year’s
   statutory documentation handled by a highly experienced company
   formation facility.</p>
  <p>As well as all the benefits of our other packages, the Diamond
   Package also includes registering the company for VAT with HMRC, the
   preparation of the company’s first year accounts and
   calculation and completion of the Corporation Tax Return subject to
   certain criteria.</p>
  <h3>What does the Diamond Package include?</h3>
  <p>A highly personalized service that will not only take care of all
   the necessary documentation at the time of incorporation but also
   ensure that the company is registered with HMRC for VAT purposes
   and, at the end of the first year of trading, the company’s
   annual accounts,
   <a href="/confirmation-statement-service/">confirmation statement</a>
   and
   <a href="/corporation-tax/">Corporate Tax return</a>
   will be prepared. The Diamond Package takes care of every
   single aspect of setting up a company and dealing with the first
   year’s statutory filing requirements leaving you free to
   focus on getting the company up and running.</p>
  <ul>
  <li>An incorporated limited company that is ready to begin trading</li>
  <li>Officers of the company appointed</li>
  <li>Ordinary shares issued</li>
  <li>A PDF file containing the Certificate of Incorporation, the Memorandum and Articles of Association and the share certificate/s</li>
  <li>Registration for VAT with HMRC</li>
  <li>Free filing of the company’s <a href="/confirmation-statement-service/">confirmation statement</a> for the first year</li>
  <li>Bonus! Option to use our quarterly VAT return filing service at a special rate</li>
  <li>Free access to your company management portal</li>
  <li>Free fast-track referral service for <a href="/business-banking/">business banking</a> facilities</li>
  <li>Preparation of the first year’s accounts and <a href="/corporation-tax/">Corporation Tax Return</a> subject to a maximum turnover of £100K, less than 1500 transactions in the first year’s turnover</li>
  </ul>
  <p>We offer a very quick service &ndash; your company will be usually
   formed within three to four hours of placing your order, subject to
   Companies House response times.</p>
  <h3>The process</h3>
  <ol>
  <li>Use our free tool to do a company name search to check that your chosen company name is available. If it is not, we will recommend a few alternatives</li>
  <li>Complete the self-guided company incorporation application form with details of the company secretary, directors, shareholders, <a href="/registered-office-address/">registered address</a> and <a href="/service-address/">director service address</a>, if applicable</li>
  <li>We’ll submit the application to Companies House on your behalf, along with the appropriate fee</li>
  <li>We will contact you via email (usually within 24 hours), once your company has been incorporated and registered at Companies House.</li>
  </ol>
