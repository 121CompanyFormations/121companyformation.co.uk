        <div class="cf-prose">
          <p>So you want to close down your company? In other words you want to strike off your company from the register and have it dissolved.</p>
          <p>There are a number of reasons people may wish to strike off their company. Perhaps the timing wasn&rsquo;t quite right and the company has been dormant for some time; or things may have gone a little sour with a business partner; or the directors may have decided to hang up their boots and retire and there is no one to take over from them. Whatever the reason, this is something we can help with. However there are a few key criteria that your company has to meet if you wish to opt for voluntary striking off:</p>
          <ul>
          <li>Your company has not traded in the last 3 months.</li>
          <li>Your company has not made any financial transactions in the last 3 months, including making payments or taking out a loan or receiving any deposits.</li>
          <li>Your company has not sold property, rights to goods or stock that it owned just before ceasing to be in business.</li>
          <li>Your company is not in the process of changing its name.</li>
          <li>Your company is not already going through insolvency proceedings.</li>
          </ul>
          <p>It is serious offence to attempt to close down your company if any of the above conditions applies. This offence carries a maximum penalty of &pound;5,000.</p>
          <p><strong>Next Steps</strong></p>
          <p>Once you are happy that your company complies with all of the above conditions, the next steps are as follows:</p>
          <ul>
          <li>Seek agreement from the majority of the company directors. So from the sole director if only 1, by both if there are 2, or by the majority if there are more than 2.</li>
          <li>For assistance contact us either by sending an email to <a href="mailto:info@121companyformation.co.uk">info@121companyformation.co.uk</a> or call us on +44 (0)203 8932 121.</li>
          </ul>
