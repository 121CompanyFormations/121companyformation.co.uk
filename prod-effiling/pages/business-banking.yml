  <section class="cf-section">
    <div class="cf-container">
      <div class="cf-split">
        <div class="cf-prose">
          <p>121 Company Formation works with various financial institutions that provide a vast range of services that can help your company get off to a flying start.</p>
          <p>When you use <a href="/packages/#packages">our company formation services</a>, we automatically offer you the option of a fast-track referral service with one of our financial institution partners (listed below).</p>
          <p>These are all financial institutions that we know would be interested in working with a company such as yours, based on the information we hold for you. The application for and approval of a business banking account is entirely at the discretion of the financial institution, and subject to their own eligibility criteria.</p>
          <p>Unfortunately, currently, we do not offer bank accounts for non-UK resident customers.</p>

          <h2>Banking partners</h2>
          <div class="cf-banks cf-banks--page" aria-label="Banking partner logos">
            <a href="#partner-countingup">
              <img loading="lazy" src="/assets/custom/images/banking/counting-up.webp" width="70" height="70" alt="Countingup" />
            </a>
            <a href="#partner-cashplus">
              <img loading="lazy" src="/assets/custom/images/banking/cashplus.webp" width="70" height="70" alt="Cashplus" />
            </a>
            <a href="#partner-barclays">
              <img loading="lazy" src="/assets/custom/images/banking/barclays.webp" width="70" height="70" alt="Barclays" />
            </a>
            <a href="#partner-tide">
              <img loading="lazy" src="/assets/custom/images/banking/tide.webp" width="70" height="70" alt="Tide" />
            </a>
            <a href="#partner-anna">
              <img loading="lazy" src="/assets/custom/images/banking/anna.webp" width="70" height="70" alt="ANNA Money" />
            </a>
          </div>

          <div class="cf-bank-partners">
            <details class="cf-bank-partner" id="partner-countingup" open>
              <summary>
                <img src="/assets/custom/images/banking/counting-up.webp" width="48" height="48" alt="" />
                <span>Countingup</span>
              </summary>
              <div class="cf-bank-partner__body">
                <p>Simply select CountingUp on the Business Banking referral page whilst completing your company formation order. You will receive an email containing a link to open your account with Counting Up once your company has been formed. Your business bank account should be open within minutes.</p>
                <h3>What does Counting Up offer?</h3>
                <ul>
                  <li>Convenient services that allow you more free time to grow your business</li>
                  <li>Services that enable you to do your accounting within minutes</li>
                  <li>Easy access to your cloud-based data anytime and from anywhere</li>
                  <li>Stress-free banking that puts you in control of getting paid on time</li>
                  <li>Confidence that you are paying the correct tax which gives you a real-time view of their business performance and tax position</li>
                </ul>
                <p class="cf-bank-partner__legal">Terms and Conditions apply. Counting Ltd designs and operates the Countingup website and app. Company Number 10729748. The Countingup business current account is an e-money account provided by Prepay Solutions (“PPS”), a trading name of Prepay Technologies Ltd which is an electronic money institution authorized by the Financial Conduct Authority under the Electronic Money Regulations 2011 (FRN 900010) for the issuing of electronic money. PPS holds an equivalent amount to the money in Countingup current accounts in a safeguarding account with Barclays Bank PLC which gives customers protection against PPS’ insolvency. The Countingup Mastercard is issued by Prepay Technologies Ltd pursuant to a licence by Mastercard International.</p>
              </div>
            </details>

            <details class="cf-bank-partner" id="partner-cashplus">
              <summary>
                <img src="/assets/custom/images/banking/cashplus.webp" width="48" height="48" alt="" />
                <span>Cashplus</span>
              </summary>
              <div class="cf-bank-partner__body">
                <p>Simply select Cashplus on the Business Banking referral page whilst completing your company formation order. Once your company has been incorporated you will receive an email and text with instructions on how to open your account. Cashplus does not require a credit check to open an account.</p>
                <h3>What does Cashplus offer?</h3>
                <ul>
                  <li>Cashplus is suitable for any type or size of business</li>
                  <li>100% approval — guaranteed bank account once you are verified by the bank</li>
                  <li>An instant bank account number and ready to use sort code</li>
                  <li>No credit check requirements</li>
                  <li>Loans of up to £2,000, subject to approval</li>
                  <li>Convenient mobile app and online services</li>
                  <li>Ability to deposit and withdraw cash at any UK Post Office</li>
                  <li>Fully integration with accounting software</li>
                  <li>Just £69 annually</li>
                </ul>
                <h3>What does Cashplus require from you?</h3>
                <ul>
                  <li>You must be over 18 years old</li>
                  <li>Proof of identity</li>
                  <li>Proof of address</li>
                  <li>Valid email address</li>
                  <li>You will also require a smartphone or a computer to access your account</li>
                </ul>
                <p class="cf-bank-partner__legal"><strong>Disclaimer.</strong> Cashplus is a trading name of APS. More details about how your information is used can be found under the heading ‘Protecting your personal data’ in the Cashplus Terms and Conditions. The information APS Financial Ltd (“AFL”) and Advanced Payment Solutions Ltd (“APS”) hold about you will be used to provide the products and services requested and for identification, account administration and fraud/loss prevention purposes. AFL are the issuer and operator of your Cashplus Mastercard and the operator of your Cashplus current account. APS provides card administration services on behalf of AFL.</p>
              </div>
            </details>

            <details class="cf-bank-partner" id="partner-barclays">
              <summary>
                <img src="/assets/custom/images/banking/barclays.webp" width="48" height="48" alt="" />
                <span>Barclays business bank account</span>
              </summary>
              <div class="cf-bank-partner__body">
                <p>Simply select Barclays on the Business Banking referral page whilst completing your company formation order, and your details will be sent securely to Barclays who will contact you within 48 hours to arrange for an account opening meeting with a Business Manager.</p>
                <h3>What does Barclays offer?</h3>
                <ul>
                  <li>Banking services with a well-established high-street bank</li>
                  <li>Up to three free account options</li>
                  <li>Cashback with the Barclays Blue Rewards program</li>
                  <li>Convenient banking access via the Barclays app which allows you to access your account from anywhere, anytime</li>
                  <li>Telephone and online support</li>
                  <li>Local branches for additional support</li>
                  <li>Overdraft facilities</li>
                </ul>
                <h3>What does Barclays need from you?</h3>
                <ul>
                  <li>
                    <strong>Proof of identity:</strong>
                    <ul>
                      <li>One document to prove your identity</li>
                      <li>One document to prove your address in the UK</li>
                      <li>Documentation to prove your company address</li>
                    </ul>
                  </li>
                  <li>
                    <strong>Company details:</strong>
                    <ul>
                      <li>Certificate of incorporation</li>
                      <li>Companies House registration documents</li>
                      <li>Basic information about your business</li>
                      <li>Personal details of the directors</li>
                    </ul>
                  </li>
                </ul>
                <p class="cf-bank-partner__legal"><strong>Important information.</strong> Barclays does not offer bank accounts to non-resident UK customers. To set up a bank account with Barclays, you must:</p>
                <ul>
                  <li>Have a Barclays or Barclaycard account</li>
                  <li>Have a mobile phone number</li>
                  <li>Be aged 16 or over to use the Barclays mobile app</li>
                </ul>
              </div>
            </details>

            <details class="cf-bank-partner" id="partner-tide">
              <summary>
                <img src="/assets/custom/images/banking/tide.webp" width="48" height="48" alt="" />
                <span>Tide</span>
              </summary>
              <div class="cf-bank-partner__body">
                <p>Simply select Tide on the Business Banking referral page whilst completing your company formation order. You will receive an email containing a link to open your account with Tide once your company has been formed. Your business bank account should be open within minutes.</p>
                <p>Within minutes Tide offers you a sort code and bank account number, allows you to apply for credit in minutes, makes accounting easy with auto-tagged transactions, and enables you to receive money instantly, directly into your account once approved.</p>
                <h3>What does Tide offer?</h3>
                <ul>
                  <li>Fast account approval process — open an account within minutes</li>
                  <li>No monthly fees on standard accounts</li>
                  <li>Auto-tagged transactions and expense management features</li>
                  <li>An app that allows you to easily pay and send invoices</li>
                  <li>Manage up to five companies’ accounts via the app</li>
                  <li>Integration with your favourite accounting software</li>
                  <li>It takes only five minutes to open an account</li>
                </ul>
              </div>
            </details>

            <details class="cf-bank-partner" id="partner-anna">
              <summary>
                <img src="/assets/custom/images/banking/anna.webp" width="48" height="48" alt="" />
                <span>ANNA Money</span>
              </summary>
              <div class="cf-bank-partner__body">
                <p>An ANNA business account allows you to open a company bank account in minutes, gives you a debit card and helps you to manage your cash-flow with software that allows you to easily create, send and chase your invoices.</p>
                <h3>What does ANNA Money offer?</h3>
                <ul>
                  <li>24/7 UK-based customer support</li>
                  <li>Software that enables you to use the platform for invoicing clients</li>
                  <li>Back-office assistance</li>
                  <li>The option to acquire shares in the company</li>
                  <li>Meet and greet opportunities at networking events</li>
                  <li>Zero account fees for three months</li>
                  <li>Help with tax services</li>
                </ul>
                <h3>What does ANNA Money need from you?</h3>
                <ul>
                  <li>You must be over 18 years of age</li>
                  <li>Personal details (name, address and date of birth)</li>
                  <li>An ID photo such as your driving licence or passport</li>
                  <li>Business details and proof of company address</li>
                  <li>Companies House number or other relevant details</li>
                  <li>Unique Taxpayer Reference</li>
                </ul>
                <p class="cf-bank-partner__legal"><strong>Terms and conditions apply.</strong> Absolutely No Nonsense Limited. ‘ANNA’ is a trademark of Absolutely No Nonsense Limited. Registered Office: Capital Tower, Greyfriars Road, Cardiff, Wales, CF10 3AG. Company Number: 10149389. Mastercard is a registered trademark, and the circles design is a trademark of Mastercard International Incorporated. The card is issued by Wirecard Card Solutions Ltd (“WDCS”) pursuant to licence by Mastercard International Incorporated. WDCS is authorised by the Financial Conduct Authority to conduct electronic money service activities under the Electronic Money Regulations 2011 (Ref: 900051).</p>
              </div>
            </details>
          </div>
        </div>

