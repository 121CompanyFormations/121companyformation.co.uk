      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a SIC code?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A SIC code, or Standard Industrial Classification code, is a unique identifier used to classify businesses by their type of economic activity."
          }
        },
        {
          "@type": "Question",
          "name": "How do I find the correct SIC code for my business?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can use the official UK SIC code lookup tool or consult our expert resources to identify the SIC code that best represents your business activity."
          }
        },
        {
          "@type": "Question",
          "name": "Is it mandatory to use a SIC code for company registration?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, a SIC code is required when registering a business in the UK to classify the nature of your company's activities."
          }
        }
