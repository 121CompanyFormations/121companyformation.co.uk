  <p><strong>Dormant Company Definition</strong>: When a company has
   not traded during the current financial year it is considered
   dormant. This applies to companies that have had:</p>
  <ul>
  <li>
   No incoming or outgoing financial transactions during that
   period
   </li>
  <li>No income from other sources</li>
  <li>No significant accounting transactions</li>
  </ul>
   If the company has any invoices that remain unpaid, bank interest or
   charges that fall due within the accounting year, these will be
   considered a significant accounting transaction, and the company
   will not be considered to be dormant.</p><p><strong>Dormant vs Non-Trading</strong>. A non-trading company is
   one that may not have executed any business transactions during the
   financial year, but may have made certain other payments or received
   income. This could include, for example, rent, wages, banking and
   legal fees.</p><p>A dormant company, however, will have not have undertaken any
   significant accounting transactions during the year and, as such,
   will not be liable to pay corporation tax. This applies when the
   company is either:
   <ul>
  <li>No longer trading and has no income or</li>
  <li>
   Is a newly incorporated company that has yet to begin trading
   </li>
  </ul>
  <h3>
   PURCHASE OUR DORMANT ACCOUNT FILING SERVICE
