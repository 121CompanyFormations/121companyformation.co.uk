   are prepared and filed in a timely manner.</p>
  <h3>HOW IT WORKS</h3>
  <p>121 Company Formation provides a dormant account filing service
   for limited companies.</p><p>If we did not incorporate the company for you, in order to file
   these accounts at Companies House, we will require:</p>
  <ol>
  <li>The company name and number</li>
  <li>
   Share information &ndash; amount and value of paid/unpaid shares
   </li>
  <li>The company authentication code</li>
  </ol>
  <p>We require a minimum of 5 business days to file your dormant
   account.</p>
   121 Company Formation holds no responsibility for any financial
   penalties levied by Companies House for the late filing of dormant
   company accounts if you failed to allow three working days between
   the placement of your order and your filing due date.
