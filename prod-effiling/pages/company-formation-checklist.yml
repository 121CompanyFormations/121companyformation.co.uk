                  </label>
                  <label class="cf-checklist__tab" for="cf-check-6">
                    <span class="cf-guide__num" aria-hidden="true">6</span>
                    <span class="cf-guide__tab-text">
                      <span class="cf-guide__tab-label">Item 6</span>
