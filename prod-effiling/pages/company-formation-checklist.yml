                  </label>
                  <label class="cf-checklist__tab" for="cf-check-1">
                    <span class="cf-guide__num" aria-hidden="true">1</span>
                    <span class="cf-guide__tab-text">
                      <span class="cf-guide__tab-label">Item 1</span>
                      <span class="cf-guide__tab-title">Company name</span>
                    </span>
                  </label>
                </div>
              </li>
              <li>
                <div class="cf-checklist__tab-wrap">
                  <label class="cf-checklist__tick" title="Mark as ready">
