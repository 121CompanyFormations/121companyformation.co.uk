                    <span class="cf-checklist__tick-ui" aria-hidden="true"></span>
                    <span class="cf-sr-only">Mark “Registered office” as ready</span>
                  </label>
                  <label class="cf-checklist__tab" for="cf-check-2">
                    <span class="cf-guide__num" aria-hidden="true">2</span>
                    <span class="cf-guide__tab-text">
                      <span class="cf-guide__tab-label">Item 2</span>
                      <span class="cf-guide__tab-title">Registered office</span>
                    </span>
                  </label>
                </div>
              </li>
              <li>
                <div class="cf-checklist__tab-wrap">
                  <label class="cf-checklist__tick" title="Mark as ready">
                    <input type="checkbox" data-cf-checklist-item="3" />
                    <span class="cf-checklist__tick-ui" aria-hidden="true"></span>
                    <span class="cf-sr-only">Mark “SIC code” as ready</span>
                  </label>
                  <label class="cf-checklist__tab" for="cf-check-3">
                    <span class="cf-guide__num" aria-hidden="true">3</span>
