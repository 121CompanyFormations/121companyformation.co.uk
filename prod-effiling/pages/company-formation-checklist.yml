            <div class="cf-guide__panels cf-checklist__panels">
              <article class="cf-guide__panel" data-panel="1" aria-labelledby="cf-check-title-1">
                <p class="cf-eyebrow">Checklist 1 of 6</p>
                <h2 id="cf-check-title-1">The company’s name</h2>
                <p>Once you have decided the name you would like to use for your company, visit our homepage to use our quick search tool to confirm whether the company name is available. We provide this resource free of charge, so you can try as many company name variations as you like until you find one that is suitable, available, and approved by Companies House.</p>
                <p>All companies that are limited by shares or by guarantee must feature the word ‘Limited’ in their name (abbreviated to Ltd). In Wales, the equivalent ‘Cyfyngedig’ (abbreviated to Cyf) should be used.</p>
                <p><strong>Sensitive words:</strong> Every company name has to be approved by Companies House. If the name contains a sensitive word or phrase, supporting documentation will be required to justify its use (further details will be provided during the order process). An additional administrative/processing fee may apply.</p>
                <p><strong>Name approval:</strong> A company name may not be approved if it is too similar to an existing one, implies a connection to the UK government, or contains certain non-standard characters such as symbols and abbreviations.</p>
                <div class="cf-guide__actions">
                  <a class="cf-btn cf-btn--outline" href="/online-company-name-search-tool/">Check a name</a>
                  <label class="cf-btn cf-btn--primary" for="cf-check-2">Next item</label>
                </div>
              </article>

              <article class="cf-guide__panel" data-panel="2" aria-labelledby="cf-check-title-2">
                <p class="cf-eyebrow">Checklist 2 of 6</p>
                <h2 id="cf-check-title-2">The company’s registered office</h2>
                <p>In the UK, every company is by law required to have a <a href="/registered-office-address/">registered company address</a> which must be a physical address rather than, for example, a PO Box or similarly non-locatable building.</p>
                <p>This is the address that government departments and other parties such as banks, shareholders, customers, suppliers, and the general public will send correspondence to, including official correspondence and statutory documents.</p>
                <div class="cf-guide__actions">
                  <label class="cf-btn cf-btn--outline" for="cf-check-1">Previous</label>
                  <a class="cf-btn cf-btn--outline" href="/registered-office-address/">Registered office service</a>
                  <label class="cf-btn cf-btn--primary" for="cf-check-3">Next item</label>
                </div>
              </article>

              <article class="cf-guide__panel" data-panel="3" aria-labelledby="cf-check-title-3">
                <p class="cf-eyebrow">Checklist 3 of 6</p>
                <h2 id="cf-check-title-3">The company’s SIC code</h2>
                <p>A SIC code (Standard Industrial Classification code) is used by Companies House to classify the nature of a company’s business. 121 Company Formation will make a recommendation on the most appropriate SIC code for your business.</p>
                <p>As part of the application process, we will also provide you a list of SIC codes which you can browse to identify the one that best suits your company.</p>
                <div class="cf-guide__actions">
                  <label class="cf-btn cf-btn--outline" for="cf-check-2">Previous</label>
                  <label class="cf-btn cf-btn--primary" for="cf-check-4">Next item</label>
                </div>
              </article>

              <article class="cf-guide__panel" data-panel="4" aria-labelledby="cf-check-title-4">
                <p class="cf-eyebrow">Checklist 4 of 6</p>
                <h2 id="cf-check-title-4">Shares and shareholders</h2>
                <p>Each limited company must have a minimum of one shareholder, and is permitted to have as many as it wishes. In many smaller companies, one shareholder often holds 100% of the issued share capital, which can be as little as one share.</p>
                <p>For a wider distribution of ownership, more shares can be issued and allocated to as many different shareholders as required. Issuing 100 shares for distribution would generally suffice unless a large financial investment requires more share capital.</p>
                <p>Once you have decided how many shares will be issued and who the shareholder(s) will be, we will need:</p>
                <ul>
                  <li>How many shares the company will issue</li>
                  <li>The total value of all the shares (the company’s share capital)</li>
                  <li>The name and address of each shareholder</li>
                </ul>
                <p>Shareholders should be aware that, should the company fail, they are each responsible for any outstanding amount due on unpaid shares. It is wise not to allot a high number of unpaid shares unless you are confident they will be paid for.</p>
                <p>Shareholders and the number of shares can be changed after incorporation. For example, the company may choose to <a href="/allocation-of-shares/">issue new shares</a>, and we can assist with that process.</p>
                <div class="cf-guide__actions">
                  <label class="cf-btn cf-btn--outline" for="cf-check-3">Previous</label>
                  <label class="cf-btn cf-btn--primary" for="cf-check-5">Next item</label>
                </div>
              </article>

              <article class="cf-guide__panel" data-panel="5" aria-labelledby="cf-check-title-5">
                <p class="cf-eyebrow">Checklist 5 of 6</p>
                <h2 id="cf-check-title-5">Persons with significant control (PSC)</h2>
                <p>Typically the person with significant control of a company is a director or shareholder. The following details will be required for all PSCs:</p>
                <ul>
                  <li>Full name</li>
                  <li>Date of birth</li>
                  <li>Place of birth (nationality)</li>
                  <li>Occupation (although ‘Director’ will suffice)</li>
                  <li>Residential address</li>
                  <li><a href="/service-address/">Service/correspondence address</a>, if different</li>
                  <li>Number and class of shares held</li>
                  <li>The reason why they are considered to be a person with significant control</li>
                  <li>Acknowledgement that they confirm themselves to be a person with significant control</li>
                </ul>
                <p>A PSC can also be a corporate entity. In that case we will require:</p>
                <ul>
                  <li>The registered corporate name, number and address</li>
                  <li>The number and class of shares the PSC will hold and the amount paid for them</li>
                  <li>Details of the authorised signatory</li>
                  <li>If the PSC is a company based outside of the EEA: legal documents equivalent to the Certificate of Incorporation and Memorandum &amp; Articles of Association, plus confirmation of the country of incorporation</li>
                </ul>
                <div class="cf-guide__actions">
                  <label class="cf-btn cf-btn--outline" for="cf-check-4">Previous</label>
                  <label class="cf-btn cf-btn--primary" for="cf-check-6">Next item</label>
                </div>
              </article>

              <article class="cf-guide__panel" data-panel="6" aria-labelledby="cf-check-title-6">
                <p class="cf-eyebrow">Checklist 6 of 6</p>
                <h2 id="cf-check-title-6">Company directors</h2>
                <p>A limited company must have at least one director who can be either an individual or a corporate entity. An individual director must:</p>
                <ul>
                  <li>Be over 16 years of age</li>
                  <li>Not have a criminal record</li>
                  <li>Not have been declared insolvent or faced bankruptcy proceedings</li>
                  <li>Not appear on the disqualified directors register at Companies House</li>
                  <li>Not act as the company’s auditor</li>
                </ul>
                <p><strong><a href="/director-appointment-and-resignation/">Appointment of a new director</a>:</strong> New directors can be appointed at any time. There are no restrictions on how many directors a company can have.</p>
                <p>Information required for each individual director:</p>
                <ul>
                  <li>Full name</li>
                  <li>Date of birth</li>
                  <li>Place of birth (nationality)</li>
                  <li>Occupation (although ‘Director’ will suffice)</li>
                  <li>Residential address</li>
                  <li>Service/correspondence address if different</li>
                  <li>Date of appointment as a director</li>
                </ul>
                <p>If the director is a corporate entity, we need:</p>
                <ul>
                  <li>The registered corporate name, number and address</li>
                  <li>The number of shares the corporate director will hold and the amount paid for them</li>
                  <li>Details of the authorised signatory</li>
                  <li>If based outside of the EEA: legal documents equivalent to the Certificate of Incorporation and Memorandum &amp; Articles of Association, plus confirmation of the country of incorporation</li>
                </ul>
                <div class="cf-guide__actions">
                  <label class="cf-btn cf-btn--outline" for="cf-check-5">Previous</label>
                  <a class="cf-btn cf-btn--primary" href="/packages/#packages">Form your company</a>
                </div>
              </article>
            </div>
