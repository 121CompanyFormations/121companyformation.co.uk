                    <span class="cf-checklist__tick-ui" aria-hidden="true"></span>
                    <span class="cf-sr-only">Mark “Shares &amp; shareholders” as ready</span>
                  </label>
                  <label class="cf-checklist__tab" for="cf-check-4">
                    <span class="cf-guide__num" aria-hidden="true">4</span>
                    <span class="cf-guide__tab-text">
                      <span class="cf-guide__tab-label">Item 4</span>
                      <span class="cf-guide__tab-title">Shares &amp; shareholders</span>
                    </span>
