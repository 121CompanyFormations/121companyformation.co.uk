  <section class="cf-section">
    <div class="cf-container">
      <div class="cf-split">
        <div>
          <p class="cf-guide-intro">We offer a quick and efficient company formation service. To complete the process typically within 24 business hours, we need certain information from you. Work through the checklist below — tick each item when you have it ready.</p>

          <div class="cf-checklist" data-cf-checklist>
