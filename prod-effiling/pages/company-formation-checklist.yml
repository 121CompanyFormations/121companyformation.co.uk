              </div>
              <div class="cf-checklist__bar" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" data-cf-checklist-bar>
                <span data-cf-checklist-fill></span>
              </div>
            </div>

            <input class="cf-guide__radio" type="radio" name="cf-checklist-step" id="cf-check-1" checked />
            <input class="cf-guide__radio" type="radio" name="cf-checklist-step" id="cf-check-2" />
            <input class="cf-guide__radio" type="radio" name="cf-checklist-step" id="cf-check-3" />
            <input class="cf-guide__radio" type="radio" name="cf-checklist-step" id="cf-check-4" />
            <input class="cf-guide__radio" type="radio" name="cf-checklist-step" id="cf-check-5" />
            <input class="cf-guide__radio" type="radio" name="cf-checklist-step" id="cf-check-6" />

            <ol class="cf-checklist__nav" aria-label="Checklist items">
              <li>
