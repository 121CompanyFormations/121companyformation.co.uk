  <p>When a company’s turnover (sales) reaches or exceeds a
   certain threshold, it must register for VAT with HMRC, charge VAT
   on any sales it makes, and submit a quarterly VAT return. The
   threshold is currently set at &pound;85,000 for the 2020/21
   financial year, but it does change annually.</p><p><strong>How to Calculate VAT Return</strong>: A VAT return is
   completed based on the information contained in the
   company’s bookkeeping system. This includes:</p>
  <ul>
  <li>
   The total sales made by the company broken down into the net
   figure and the VAT amount (the output VAT) and
   </li>
  <li>
   The total purchases made by the company, again broken down into
   a net figure and the VAT amount (the input VAT)
   </li>
  </ul>
   Subtracting your company’s input VAT from its output VAT will
   result in a sum that is due to be paid to HMRC. If your input VAT is
   higher than your output VAT, the company will be due a refund from
   HMRC.</p><p>There are several options for filing your VAT Returns. Companies
   can:
   <ul>
  <li>
   File their quarterly VAT returns online via the HMRC VAT website
   </li>
  <li>
   Use the services of an accountant to prepare a VAT return every
   three months
   </li>
  <li>
   Order the 121 Company Formation Accounting Services package to
   have us professionally and seamlessly prepare and file your VAT
   Return
   </li>
  </ul>
   121 Company Formation is an experienced accounting firm that
   specializes in offering a range of services to start-ups, small and
   medium sized companies including offering sound business advice,
   assisting in running their operations in the most tax efficient way,
   <a href="/year-end-accounts/">
   preparing their year-end accounts
   </a>
   , and preparing and filing their VAT Returns.
   

   
   <h3>
   WHAT IS THE VAT RETURN DEADLINE?
   </h3>
  <p>There are five different accounting schemes. The due date is the
   same for each &ndash; one month and seven days following the end
   of the three month accounting period, i.e. the return for April,
   May and June must be filed by 6th August</p><p>121 Company Formation will be able to advise you which is the best
   VAT scheme for your company from:</p>
  <ul>
  <li>Standard VAT accounting</li>
  <li>Annual VAT accounting</li>
  <li>Flat rate VAT</li>
  <li>Flat accounting</li>
  <li>VAT margin</li>
  </ul>
