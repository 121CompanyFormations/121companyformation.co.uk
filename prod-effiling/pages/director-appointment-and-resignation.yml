  <p><strong>Appointing a Director</strong>: When a limited company is
   first incorporated, at least one company director must be
   appointed. Thereafter any number of other directors can be
   appointed providing each meets the following criteria:</p>
  <ul>
  <li>They are over 16 years of age</li>
  <li>They do not have a criminal record</li>
  <li>
   They have not been declared insolvent nor faced bankruptcy
   proceedings
   </li>
  </ul>
  <strong>Appointment of Director Form</strong>: To appoint a new
   director, the AP01 form must be completed and submitted to Companies
   House. Companies House will register the details of the new director
   on the company’s record.</p><p><strong>Resignation of Director:</strong> A director can resign from
   a company at any time and this can be for a variety of reasons.
   Reasons for resigning could include:

   <ul>
  <li>Ill health</li>
  <li>Retirement</li>
  <li>Change of job/moving to other employment</li>
  <li>Death</li>
  <li>Inability to work with the other directors</li>
  <li>Being disqualified from holding the position of director</li>
  </ul>
  <strong>Director Resignation Form:</strong> Companies House form
   TM01 must be submitted to inform them about the change to the
   company’s directors. However, no reason for the resignation
   has to be provided on the form.</p><p><h3>
   ACCESS OUR SERVICE!
   </h3>
   Does one of your company directors wish to resign, or do you want to
   appoint a new director? We offer a complimentary service to process
   and submit the paperwork to Companies House on your behalf. Once
   processed, the changes will appear in the company filing history,
   usually within 24 hours.</p><p><h3>
   WHAT INFORMATION WILL I NEED FOR THE APPOINTMENT OF A NEW
   DIRECTOR?
   </h3>
  <ul>
  <li>Date of birth</li>
  <li>Place of birth (nationality)</li>
  <li>Occupation (‘Director’ will suffice)</li>
  <li>Residential address</li>
  <li>
  <a
   href="/service-address/"
   >
   Service/correspondence address, if different
   </a>
  </li>
  <li>Date of appointment as a director</li>
  </ul>
