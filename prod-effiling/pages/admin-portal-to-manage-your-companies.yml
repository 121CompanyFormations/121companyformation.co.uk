  <h2>
   Admin Portal | 121 Company Formation
   </h2>
  <p>We are pleased to offer all of our clients a convenient, self-serve online Admin Portal where they can manage their company portfolio and activities, including keep tracking of the progress of any orders placed, as well as every aspect of their company’s statutory requirements.</p><p>Below we provide a step by step guide to creating an account and using this free, ultra-convenient tool.</p>
  <h3>
   REGISTERING AS A NEW USER
   </h3>
  <p>To create an account, simply enter your email address, a password, and some basic contact information. After registering you will be able to begin purchasing any of our services such as company incorporation or any of our other additional post-incorporation support services. You can also use the Admin Portal to import an existing company into your account.</p>
  <h3>
   LOGGING INTO YOUR ACCOUNT
   </h3>
  <p>Once you have registered and created an account (or if you already have an account), simply enter your login details to conveniently access your account at any time.</p>
  <h3>
   MY ACCOUNT
   </h3>
  <p>Use the <em>My Account</em> section to update or amend your contact details including the email address where scanned documents should be sent. You can also change your username and password at any time.</p>
  <h3>
   COMPANIES
   </h3>
  <p>Here you can access:</p>
  <ul>
  <li>
   All the companies you have incorporated using the 121 Company Formation 
   <a href="/packages/#packages">
   incorporation service 
   </a>
  </li>
  <li>
   Each company’s registration number(s) and authentication code(s)
   </li>
  </ul>
   This makes the process of incorporating any new companies in the future a quick and convenient one as our system will be able to prefill much of the application for you using all your saved information</p><p>You can also import any other companies that you may have incorporated with other service providers. This enables you to more easily manage your entire portfolio of companies, including for example, maintaining up-to-date records with Companies House.
   
   

   
   <h3>
   SERVICES
   </h3>
  <p>The <em>Services </em>area provides you a summary of all the 121 Company Formation services that have used, or are currently using. You can conveniently review each service, and update or renew your services depending on your business requirements.</p>
  <h3>
   ORDER HISTORY
   </h3>
  <p>This function allows you to view your order history with us, and includes real-time updates on the status of any orders. You can also view and print invoices as well as keep track of your payment history</p>
