  $(window).bind("load", function () {
    //Add Tooltip
    $(".efOptionalTrProduct").each(function () {
      // Append the info-tooltip div
      $(this)
        .children("td")
        .eq(2)
        .append(
          "<div class='prodinfo'><div class='info-tooltip'></div><div class='text-tooltip'></div></div>",
        );

      // Get the detail from the span inside the current efOptionalTrProduct
      var detail = $(this).find("td span.details").html();

      // Set the data-text attribute for the info-tooltip div
      $(this).find(".text-tooltip").html(detail);
    });
